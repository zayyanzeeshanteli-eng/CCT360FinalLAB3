<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lab 3 - Photo Carousel</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>The Power of Sequencing</h1>

        <h2 id="story-title">Story 1: The Storm Arrives</h2>

        <div class="photo-container">

            <div class="photo">
                <img id="image-one" src="images/storm.png" alt="Dark storm clouds">
                <p id="caption-one">Dark clouds gather over the water.</p>
            </div>

            <div class="photo">
                <img id="image-two" src="images/walking-umbrella.png" alt="Person walking with an umbrella">
                <p id="caption-two">A person walks through the rain with an umbrella.</p>
            </div>

            <div class="photo">
                <img id="image-three" src="images/umbrellas.png" alt="People standing under umbrellas">
                <p id="caption-three">People protect themselves as the rain continues.</p>
            </div>

        </div>

        <div class="buttons">
            <button id="story-one">Story 1</button>
            <button id="story-two">Story 2</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
